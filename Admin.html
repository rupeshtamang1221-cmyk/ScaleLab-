<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleLab Admin Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Syne', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 30px 20px;
        }

        h1 {
            color: #f39c12;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8em;
            margin-bottom: 30px;
        }

        .panel {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .panel h2 {
            color: #f39c12;
            margin-bottom: 20px;
            font-size: 1.2em;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 10px;
        }

        .btn {
            background: #f39c12;
            color: #0a0a0a;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover { background: #e67e22; }

        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 6px 14px;
            font-size: 0.85em;
        }

        .btn-danger:hover { background: #c0392b; }

        .key-display {
            font-family: 'JetBrains Mono', monospace;
            background: #0a0a0a;
            border: 1px solid #f39c12;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1.1em;
            color: #f39c12;
            letter-spacing: 2px;
            margin: 15px 0;
            word-break: break-all;
        }

        .copy-btn {
            background: #2a2a2a;
            color: #f39c12;
            border: 1px solid #f39c12;
            padding: 8px 18px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .copy-btn:hover { background: #f39c12; color: #0a0a0a; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }

        th {
            text-align: left;
            padding: 10px;
            color: #f39c12;
            border-bottom: 1px solid #2a2a2a;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #1a1a1a;
            color: #bbb;
        }

        tr:hover td { background: #1e1e1e; }

        .status-active {
            color: #2ecc71;
            font-weight: bold;
        }

        .status-used {
            color: #e74c3c;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 15px 20px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .stat-box .num {
            font-size: 2em;
            font-weight: 800;
            color: #f39c12;
        }

        .stat-box .label {
            font-size: 0.8em;
            color: #666;
            margin-top: 4px;
        }

        .empty-msg {
            color: #444;
            text-align: center;
            padding: 30px;
            font-family: 'JetBrains Mono', monospace;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ecc71;
            color: #0a0a0a;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div style="max-width:800px; margin: 0 auto;">
    <h1>⚙️ ScaleLab Admin</h1>
    <p class="subtitle">// LICENSE KEY MANAGEMENT PANEL</p>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-box">
            <div class="num" id="totalKeys">0</div>
            <div class="label">Total Keys</div>
        </div>
        <div class="stat-box">
            <div class="num" id="activeKeys">0</div>
            <div class="label">Active</div>
        </div>
        <div class="stat-box">
            <div class="num" id="usedKeys">0</div>
            <div class="label">Used</div>
        </div>
    </div>

    <!-- Generate Key -->
    <div class="panel">
        <h2>🔑 New Key Generate गर्नुस्</h2>
        <button class="btn" onclick="generateKey()">Generate New Key</button>
        <div id="newKeyDisplay" style="display:none;">
            <div class="key-display" id="newKeyText"></div>
            <button class="copy-btn" onclick="copyKey()">📋 Copy Key</button>
            <p style="color:#666; font-size:0.85em; margin-top:10px;">⚠️ यो key customer लाई पठाउनुस् - 200 NPR लिएपछि!</p>
        </div>
    </div>

    <!-- Keys List -->
    <div class="panel">
        <h2>📋 सबै Keys</h2>
        <div id="keysList">
            <div class="empty-msg">अझै कुनै key बनाइएको छैन।<br>माथि Generate गर्नुस्!</div>
        </div>
    </div>
</div>

<div class="toast" id="toast">✅ Copied!</div>

<script>
    const ADMIN_STORAGE_KEY = 'scalelab_admin_keys';

    function loadKeys() {
        return JSON.parse(localStorage.getItem(ADMIN_STORAGE_KEY) || '[]');
    }

    function saveKeys(keys) {
        localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(keys));
    }

    function generateKey() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let key = 'SL-';
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                key += chars[Math.floor(Math.random() * chars.length)];
            }
            if (i < 3) key += '-';
        }

        const keys = loadKeys();
        keys.push({
            key: key,
            created: new Date().toLocaleDateString('ne-NP'),
            status: 'active',
            deviceId: null
        });
        saveKeys(keys);

        document.getElementById('newKeyText').textContent = key;
        document.getElementById('newKeyDisplay').style.display = 'block';

        renderKeys();
        updateStats();
    }

    function copyKey() {
        const key = document.getElementById('newKeyText').textContent;
        navigator.clipboard.writeText(key);
        showToast('✅ Key Copied!');
    }

    function deleteKey(key) {
        if (!confirm('यो key delete गर्ने?')) return;
        let keys = loadKeys();
        keys = keys.filter(k => k.key !== key);
        saveKeys(keys);
        renderKeys();
        updateStats();
    }

    function renderKeys() {
        const keys = loadKeys();
        const container = document.getElementById('keysList');

        if (keys.length === 0) {
            container.innerHTML = '<div class="empty-msg">अझै कुनै key बनाइएको छैन।<br>माथि Generate गर्नुस्!</div>';
            return;
        }

        let html = '<table><thead><tr><th>Key</th><th>Created</th><th>Status</th><th>Action</th></tr></thead><tbody>';
        keys.slice().reverse().forEach(k => {
            html += `<tr>
                <td>${k.key}</td>
                <td>${k.created}</td>
                <td class="${k.status === 'active' ? 'status-active' : 'status-used'}">${k.status === 'active' ? '✅ Active' : '🔴 Used'}</td>
                <td><button class="btn btn-danger" onclick="deleteKey('${k.key}')">Delete</button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function updateStats() {
        const keys = loadKeys();
        const used = keys.filter(k => k.status === 'used').length;
        document.getElementById('totalKeys').textContent = keys.length;
        document.getElementById('activeKeys').textContent = keys.length - used;
        document.getElementById('usedKeys').textContent = used;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Sync used keys from app
    function syncUsedKeys() {
        const usedKeys = JSON.parse(localStorage.getItem('scalelab_used_keys') || '[]');
        const keys = loadKeys();
        keys.forEach(k => {
            if (usedKeys.includes(k.key)) k.status = 'used';
        });
        saveKeys(keys);
    }

    syncUsedKeys();
    renderKeys();
    updateStats();
</script>
</body>
</html>
